<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>割り勘計算</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      padding: 24px 16px;
      color: #e2e8f0;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .container { max-width: 640px; margin: 0 auto; }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* inputs */
    .input-row { display: flex; gap: 12px; }

    .input-group { flex: 1; }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 1.05rem;
      outline: none;
    }

    .input-group input:focus { border-color: #60a5fa; }

    /* slider */
    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .slider-label { font-size: 0.9rem; color: #cbd5e1; }

    .slider-amount {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fbbf24;
    }

    /* result cards */
    .result-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .result-box {
      flex: 1;
      background: #0f172a;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .result-box .r-label {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 6px;
    }

    .result-box .r-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .result-box.boss .r-value { color: #fbbf24; }
    .result-box.member .r-value { color: #34d399; }

    /* chart */
    .chart-area {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* breakdown */
    .breakdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.88rem;
    }

    .breakdown-row:last-child { border-bottom: none; }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .row-name { display: flex; align-items: center; flex: 1; }

    .row-right { display: flex; align-items: baseline; gap: 6px; }

    .row-amt { font-weight: 600; color: #f1f5f9; }

    .row-pct { font-size: 0.73rem; color: #475569; }

    /* empty state */
    .empty-msg {
      text-align: center;
      color: #334155;
      padding: 24px 0;
      font-size: 0.9rem;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>🍻 割り勘計算</h1>
  <p class="subtitle">飲み会・経費精算ツール</p>

  <!-- 基本情報 -->
  <div class="card">
    <div class="card-title">基本情報</div>
    <div class="input-row">
      <div class="input-group">
        <label for="in-total">合計金額（円）</label>
        <input type="number" id="in-total" placeholder="例: 30000" min="1" step="100">
      </div>
      <div class="input-group">
        <label for="in-count">人数（名）</label>
        <input type="number" id="in-count" placeholder="例: 5" min="1" step="1">
      </div>
    </div>
  </div>

  <!-- 上司入力 -->
  <div class="card">
    <div class="card-title">上司の負担調整</div>
    <div class="input-group">
      <label for="boss-input">👑 上司の支払い金額（円）</label>
      <input type="number" id="boss-input" placeholder="例: 10000" min="0" step="100">
    </div>
    <p id="boss-hint" style="font-size:0.78rem;color:#475569;margin-top:8px;"></p>
  </div>

  <!-- 結果 -->
  <div class="card" id="result-card">
    <div class="card-title">計算結果</div>

    <div id="empty-msg" class="empty-msg">合計金額と人数を入力すると計算します</div>

    <div id="result-content" class="hidden">
      <div class="result-row">
        <div class="result-box boss">
          <div class="r-label">👑 上司</div>
          <div class="r-value" id="disp-boss">¥0</div>
        </div>
        <div class="result-box member">
          <div class="r-label">👤 メンバー（1人あたり）</div>
          <div class="r-value" id="disp-member">¥0</div>
        </div>
      </div>

      <div class="chart-area">
        <canvas id="chart" width="240" height="240"></canvas>
      </div>

      <div id="breakdown"></div>
    </div>
  </div>
</div>

<script>
  const inTotal    = document.getElementById('in-total');
  const inCount    = document.getElementById('in-count');
  const bossInput  = document.getElementById('boss-input');
  const bossHint   = document.getElementById('boss-hint');
  const emptyMsg   = document.getElementById('empty-msg');
  const resultContent = document.getElementById('result-content');
  const dispBoss   = document.getElementById('disp-boss');
  const dispMember = document.getElementById('disp-member');
  const breakdown  = document.getElementById('breakdown');
  const canvas     = document.getElementById('chart');
  const ctx        = canvas.getContext('2d');

  const COLORS = [
    '#fbbf24', '#34d399', '#60a5fa', '#f87171',
    '#a78bfa', '#fb923c', '#4ade80', '#38bdf8',
    '#f472b6', '#facc15'
  ];

  function fmt(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }

  function drawChart(data) {
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const R  = Math.min(W, H) / 2 - 6;
    const r  = R * 0.50;
    const total = data.reduce((a, b) => a + b, 0);
    ctx.clearRect(0, 0, W, H);
    let angle = -Math.PI / 2;
    data.forEach((val, i) => {
      const sweep = (val / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, angle, angle + sweep);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.stroke();
      angle += sweep;
    });
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
    ctx.fillStyle = '#64748b';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('負担割合', cx, cy);
  }

  function update() {
    const total = parseFloat(inTotal.value);
    const count = parseInt(inCount.value);

    // 合計・人数が未入力
    if (!total || total <= 0 || !count || count < 1) {
      bossHint.textContent = '';
      emptyMsg.classList.remove('hidden');
      resultContent.classList.add('hidden');
      return;
    }

    const equal = Math.round(total / count);
    bossHint.textContent = `均等割りの場合: ${fmt(equal)} ／ 合計: ${fmt(total)}`;

    // 上司金額（未入力なら均等割りをデフォルトに）
    let bossAmt = parseFloat(bossInput.value);
    if (isNaN(bossAmt) || bossInput.value === '') {
      emptyMsg.classList.remove('hidden');
      resultContent.classList.add('hidden');
      return;
    }

    // バリデーション
    if (bossAmt < 0) bossAmt = 0;
    if (bossAmt > total) bossAmt = total;
    const bossInt = Math.round(bossAmt);

    // 1人の場合
    if (count === 1) {
      emptyMsg.classList.add('hidden');
      resultContent.classList.remove('hidden');
      dispBoss.textContent   = fmt(total);
      dispMember.textContent = '—';
      drawChart([total]);
      breakdown.innerHTML = '';
      return;
    }

    const remaining  = total - bossInt;
    const memberAmt  = Math.round(remaining / (count - 1));

    emptyMsg.classList.add('hidden');
    resultContent.classList.remove('hidden');
    dispBoss.textContent   = fmt(bossInt);
    dispMember.textContent = fmt(memberAmt);

    const data = [bossInt];
    for (let i = 1; i < count; i++) data.push(memberAmt);
    drawChart(data);

    const totalCalc = data.reduce((a, b) => a + b, 0);
    const names = ['上司'];
    for (let i = 1; i < count; i++) names.push('メンバー' + i);

    breakdown.innerHTML = data.map((v, i) => {
      const p = (v / totalCalc * 100).toFixed(1);
      return `<div class="breakdown-row">
        <span class="row-name">
          <span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>
          ${names[i]}
        </span>
        <span class="row-right">
          <span class="row-amt">${fmt(v)}</span>
          <span class="row-pct">${p}%</span>
        </span>
      </div>`;
    }).join('');
  }

  inTotal.addEventListener('input', update);
  inCount.addEventListener('input', update);
  bossInput.addEventListener('input', update);

  update();
</script>
</body>
</html>
