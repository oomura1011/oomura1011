<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ArUco 計測</title>

  <!-- js-aruco via jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/cv.js"
    onerror="showLibError('cv.js')"></script>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/aruco.js"
    onerror="showLibError('aruco.js')"></script>
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco@master/src/posit1.js"
    onerror="showLibError('posit1.js')"></script>
  <script>
    function showLibError(file) {
      var el = document.getElementById('loading-msg');
      if (el) {
        el.textContent = file + ' の読み込みに失敗しました。Wi-Fiまたはモバイル通信を確認して「再読み込み」をタップしてください。';
        el.style.color = '#f87171';
      }
      var btn = document.getElementById('reload-btn');
      if (btn) btn.style.display = 'block';
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --safe-top:    env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }
    html, body {
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
    }

    /* ── Camera ── */
    #container { position: relative; width: 100%; height: 100%; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; pointer-events: none; }
    canvas#proc { display: none; }

    /* ── Header ── */
    #header {
      position: absolute; top: calc(var(--safe-top) + 12px);
      left: 50%; transform: translateX(-50%); z-index: 20;
    }
    #title-pill {
      background: rgba(0,0,0,0.6); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff; font-size: 15px; font-weight: 600;
      padding: 8px 20px; border-radius: 20px; white-space: nowrap;
    }

    /* ── Settings (top-right) ── */
    #settings {
      position: absolute; top: calc(var(--safe-top) + 60px); right: 12px;
      z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    }
    .set-row {
      background: rgba(0,0,0,0.65); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 10px; padding: 6px 10px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .set-label { color: #94a3b8; font-size: 11px; white-space: nowrap; }
    .set-input {
      background: transparent; border: none; border-bottom: 1px solid #475569;
      color: #fff; font-size: 13px; font-weight: 700; width: 52px;
      text-align: right; outline: none;
    }
    .set-unit { color: #64748b; font-size: 11px; }

    /* ── Status badges (always visible) ── */
    #badges {
      position: absolute; bottom: calc(var(--safe-bottom) + 280px);
      left: 12px; display: flex; gap: 6px; z-index: 20;
    }
    .badge {
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff; font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 10px;
    }
    #badge-fps  { color: #4ade80; }
    #badge-cnt  { }
    #badge-lib  { color: #fbbf24; }

    /* ── Measurement panel (always visible, swipeable) ── */
    #panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(8,12,28,0.94); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid #1e293b;
      z-index: 20;
      transition: transform 0.3s ease;
      transform: translateY(0);
    }
    #panel.mini { transform: translateY(calc(100% - 54px)); }

    #panel-inner {
      padding: 0 14px calc(var(--safe-bottom) + 12px);
      max-height: 55vh; overflow-y: auto;
    }

    /* Handle */
    #handle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px 8px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #handle-bar {
      width: 36px; height: 4px; background: #334155; border-radius: 2px;
      margin: 0 auto;
    }
    #panel-title {
      font-size: 13px; font-weight: 700; color: #94a3b8;
      position: absolute; left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }

    /* Marker tabs */
    #marker-tabs {
      display: flex; gap: 6px; margin-bottom: 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    #marker-tabs::-webkit-scrollbar { display: none; }
    .m-tab {
      flex-shrink: 0; padding: 4px 12px; border-radius: 10px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      border: 1.5px solid #1e293b; color: #64748b;
      -webkit-tap-highlight-color: transparent;
    }
    .m-tab.active { color: #fff; border-color: var(--tc, #4ade80); }

    /* No-marker state */
    #no-marker-box {
      padding: 16px 0 8px; text-align: center;
    }
    #no-marker-box p { color: #475569; font-size: 13px; line-height: 1.7; }
    #no-marker-box a {
      color: #4ade80; font-size: 12px; text-decoration: none;
    }

    /* Measurement grid */
    .meas-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 10px;
    }
    .meas-card {
      background: rgba(255,255,255,0.04); border-radius: 10px;
      padding: 9px 11px;
    }
    .meas-card.full { grid-column: 1 / -1; }
    .meas-card h4 {
      font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
      color: #475569; text-transform: uppercase; margin-bottom: 6px;
    }
    .meas-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 3px;
    }
    .meas-key { font-size: 11px; color: #64748b; }
    .meas-val {
      font-size: 14px; font-weight: 700; color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }
    .meas-val.good { color: #4ade80; }
    .meas-val.warn { color: #fbbf24; }
    .meas-val.bad  { color: #f87171; }

    /* Buttons */
    .btn-row { display: flex; gap: 8px; margin-top: 2px; margin-bottom: 4px; }
    .btn {
      flex: 1; padding: 11px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-master           { background: #4ade80; color: #000; }
    #btn-master.registered { background: #22c55e; color: #000; }
    #btn-clear            { background: rgba(255,255,255,0.08); color: #94a3b8; }

    /* Splash / loading */
    #splash {
      position: absolute; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; padding: 40px; z-index: 50;
    }
    #splash.hidden { display: none; }
    #splash h2 { color: #fff; font-size: 22px; font-weight: 700; text-align: center; }
    #splash p  { color: #94a3b8; font-size: 14px; line-height: 1.7; text-align: center; }
    #start-btn {
      background: #4ade80; color: #000; border: none;
      border-radius: 14px; padding: 15px 40px;
      font-size: 17px; font-weight: 700; cursor: pointer;
    }
    #loading {
      position: absolute; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 60;
    }
    #loading.hidden { display: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #4ade80; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
<div id="container">

  <video id="video" autoplay playsinline muted></video>
  <canvas id="proc"></canvas>
  <canvas id="overlay"></canvas>

  <div id="header"><div id="title-pill">ArUco 計測</div></div>

  <!-- Settings -->
  <div id="settings">
    <div class="set-row">
      <span class="set-label">マーカーサイズ</span>
      <input class="set-input" id="in-size" type="number" value="100" min="1">
      <span class="set-unit">mm</span>
    </div>
    <div class="set-row">
      <span class="set-label">許容誤差 位置</span>
      <input class="set-input" id="in-tol-pos" type="number" value="10" min="0">
      <span class="set-unit">px /</span>
      <span class="set-label">角度</span>
      <input class="set-input" id="in-tol-ang" type="number" value="3" min="0">
      <span class="set-unit">°</span>
    </div>
  </div>

  <!-- Always-visible status badges -->
  <div id="badges">
    <span class="badge" id="badge-fps">-- FPS</span>
    <span class="badge" id="badge-cnt">検出: 0</span>
    <span class="badge" id="badge-lib">ライブラリ読み込み中</span>
  </div>

  <!-- Measurement panel -->
  <div id="panel" class="mini">
    <div id="handle-row">
      <div id="handle-bar"></div>
      <span id="panel-title">計測パネル ↑</span>
    </div>
    <div id="panel-inner">
      <div id="marker-tabs"></div>
      <div id="meas-content">
        <div id="no-marker-box">
          <p>
            ArUcoマーカーをカメラに向けると<br>
            ここに計測値が表示されます。<br><br>
            <a href="https://chev.me/arucogen/" target="_blank">
              ▶ ARUCOマーカーを生成する（ブラウザで開く）
            </a>
          </p>
        </div>
      </div>
      <div id="btn-row-wrap" style="display:none">
        <div class="btn-row">
          <button class="btn" id="btn-master">マスター登録</button>
          <button class="btn" id="btn-clear">クリア</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-msg">ライブラリを読み込み中…</p>
    <button id="reload-btn" onclick="location.reload()"
      style="display:none;margin-top:12px;background:#4ade80;color:#000;border:none;
             border-radius:12px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;">
      再読み込み
    </button>
  </div>

  <!-- Splash -->
  <div id="splash" class="hidden">
    <h2>ArUco 計測アプリ</h2>
    <p>
      iPhoneのリアカメラでArUcoマーカーの<br>
      位置・角度・傾きをリアルタイム計測します。<br><br>
      マスター登録でズレを数値確認できます。
    </p>
    <button id="start-btn">カメラを起動</button>
  </div>

</div>
<script>
// ───────────────────────────────────────────
// Elements
// ───────────────────────────────────────────
const video      = document.getElementById('video');
const proc       = document.getElementById('proc');
const overlay    = document.getElementById('overlay');
const oc         = overlay.getContext('2d');
const pc         = proc.getContext('2d', { willReadFrequently: true });
const splash     = document.getElementById('splash');
const loading    = document.getElementById('loading');
const panel      = document.getElementById('panel');
const handleRow  = document.getElementById('handle-row');
const panelTitle = document.getElementById('panel-title');
const tabs       = document.getElementById('marker-tabs');
const measContent = document.getElementById('meas-content');
const btnRowWrap = document.getElementById('btn-row-wrap');
const btnMaster  = document.getElementById('btn-master');
const btnClear   = document.getElementById('btn-clear');
const badgeFps   = document.getElementById('badge-fps');
const badgeCnt   = document.getElementById('badge-cnt');
const badgeLib   = document.getElementById('badge-lib');
const inSize     = document.getElementById('in-size');
const inTolPos   = document.getElementById('in-tol-pos');
const inTolAng   = document.getElementById('in-tol-ang');
const badges     = document.getElementById('badges');

const PALETTE = ['#4ade80','#fb923c','#38bdf8','#f9a8d4','#a78bfa','#fbbf24','#f87171','#34d399'];
function colorFor(id) { return PALETTE[id % PALETTE.length]; }

// ───────────────────────────────────────────
// State
// ───────────────────────────────────────────
let detector   = null;
let running    = false;
let selectedId = null;
let lastMarkers = [];
const masters = {};
let panelOpen = false;
let frameCount = 0, lastFpsTime = performance.now();

// ───────────────────────────────────────────
// Library init
// ───────────────────────────────────────────
const loadingMsg  = document.getElementById('loading-msg');
const reloadBtn   = document.getElementById('reload-btn');

function waitForLib(cb, deadline) {
  if (typeof AR !== 'undefined' && typeof CV !== 'undefined') { cb(); return; }
  if (performance.now() > deadline) {
    loadingMsg.textContent = 'ライブラリの読み込みに失敗しました。ネットワーク接続を確認してください。';
    loadingMsg.style.color = '#f87171';
    reloadBtn.style.display = 'block';
    return;
  }
  setTimeout(() => waitForLib(cb, deadline), 200);
}
waitForLib(() => {
  loading.classList.add('hidden');
  splash.classList.remove('hidden');
  detector = new AR.Detector();
  badgeLib.textContent = 'ライブラリOK';
  badgeLib.style.color = '#4ade80';
}, performance.now() + 15000);

// ───────────────────────────────────────────
// Panel open/close
// ───────────────────────────────────────────
handleRow.addEventListener('click', () => {
  panelOpen = !panelOpen;
  panel.classList.toggle('mini', !panelOpen);
  panelTitle.textContent = panelOpen ? '計測パネル ↓' : '計測パネル ↑';
  // Adjust badges position
  badges.style.bottom = panelOpen ? 'calc(60vh + 10px)' : 'calc(var(--safe-bottom, 16px) + 280px)';
});

// ───────────────────────────────────────────
// Camera
// ───────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startCamera);

async function startCamera() {
  splash.classList.add('hidden');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 },
      }
    });
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      const vw = video.videoWidth  || 640;
      const vh = video.videoHeight || 480;
      proc.width  = overlay.width  = vw;
      proc.height = overlay.height = vh;
      running = true;
      requestAnimationFrame(loop);
    }, { once: true });
  } catch (e) {
    splash.classList.remove('hidden');
    document.querySelector('#splash p').innerHTML =
      'カメラへのアクセスが拒否されました。<br>設定 → Safari → カメラ を「許可」にしてください。';
    document.getElementById('start-btn').textContent = '再試行';
  }
}

// ───────────────────────────────────────────
// Master buttons
// ───────────────────────────────────────────
btnMaster.addEventListener('click', () => {
  if (selectedId === null) return;
  const m = lastMarkers.find(m => m.id === selectedId);
  if (!m) return;
  masters[selectedId] = Object.assign({}, m.meas);
  btnMaster.textContent = 'マスター更新';
  btnMaster.classList.add('registered');
  renderPanel();
});

btnClear.addEventListener('click', () => {
  if (selectedId === null) return;
  delete masters[selectedId];
  btnMaster.textContent = 'マスター登録';
  btnMaster.classList.remove('registered');
  renderPanel();
});

// ───────────────────────────────────────────
// Measurement
// ───────────────────────────────────────────
function measure(id, corners) {
  const W = proc.width, H = proc.height;

  // Center (px from image center; right/down = positive)
  const rawCx = corners.reduce((s, c) => s + c.x, 0) / 4;
  const rawCy = corners.reduce((s, c) => s + c.y, 0) / 4;
  const cx = rawCx - W / 2;
  const cy = rawCy - H / 2;

  // In-plane rotation angle (edge 0→1)
  const ex = corners[1].x - corners[0].x;
  const ey = corners[1].y - corners[0].y;
  const angle = Math.atan2(ey, ex) * 180 / Math.PI;

  // Apparent side length (average)
  let peri = 0;
  for (let i = 0; i < 4; i++) {
    const a = corners[i], b = corners[(i + 1) % 4];
    peri += Math.hypot(b.x - a.x, b.y - a.y);
  }
  const sideLen = peri / 4;

  // px/mm scale
  const sizeMm = parseFloat(inSize.value) || 0;
  const scale  = sizeMm > 0 ? sideLen / sizeMm : null;

  // POSIT (3D pose)
  let pitch = null, roll = null, distCm = null, pose = null;
  if (sizeMm > 0 && typeof POS !== 'undefined') {
    try {
      const focalLen = W * 0.8;
      const posit = new POS.Posit(sizeMm, focalLen);
      const imgPts = corners.map(c => ({ x: c.x - W / 2, y: -(c.y - H / 2) }));
      pose = posit.pose(imgPts);
      const R = pose.bestRotation;
      const T = pose.bestTranslation;
      pitch  = Math.atan2(-R[2][0], Math.sqrt(R[2][1] ** 2 + R[2][2] ** 2)) * 180 / Math.PI;
      roll   = Math.atan2(R[2][1], R[2][2]) * 180 / Math.PI;
      distCm = Math.abs(T[2]) / 10;
    } catch (_) { /* POSIT failed gracefully */ }
  }

  return { cx, cy, angle, pitch, roll, distCm, scale, sideLen, pose, rawCx, rawCy };
}

// ───────────────────────────────────────────
// Main loop
// ───────────────────────────────────────────
let lastRender = 0;

function loop() {
  if (!running || video.readyState < 2) { requestAnimationFrame(loop); return; }

  // Capture frame
  pc.drawImage(video, 0, 0, proc.width, proc.height);
  const imageData = pc.getImageData(0, 0, proc.width, proc.height);

  // Detect
  let detected = [];
  try { detected = detector.detect(imageData); } catch (_) {}

  // Build marker list with measurements
  lastMarkers = detected.map(m => ({
    id:      m.id,
    corners: m.corners,
    meas:    measure(m.id, m.corners),
  }));

  // Draw overlays
  oc.clearRect(0, 0, overlay.width, overlay.height);
  const sx = overlay.width  / proc.width;
  const sy = overlay.height / proc.height;
  for (const m of lastMarkers) drawMarker(m, sx, sy);

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime > 600) {
    const fps = (frameCount / ((now - lastFpsTime) / 1000)).toFixed(1);
    badgeFps.textContent = `${fps} FPS`;
    badgeCnt.textContent = `検出: ${lastMarkers.length}`;
    frameCount = 0;
    lastFpsTime = now;
  }

  // Panel update at ~10 fps
  if (now - lastRender > 100) {
    lastRender = now;
    renderPanel();
  }

  requestAnimationFrame(loop);
}

// ───────────────────────────────────────────
// Drawing
// ───────────────────────────────────────────
function drawMarker(m, sx, sy) {
  const { id, corners, meas } = m;
  const color  = colorFor(id);
  const master = masters[id];
  const tolPos = parseFloat(inTolPos.value) || 10;
  const tolAng = parseFloat(inTolAng.value) || 3;

  // Status color
  let sc = color;
  if (master) {
    const dPos = Math.hypot(meas.cx - master.cx, meas.cy - master.cy);
    const dAng = Math.abs(angleDiff(meas.angle, master.angle));
    sc = dPos > tolPos * 2 || dAng > tolAng * 2 ? '#f87171'
       : dPos > tolPos     || dAng > tolAng     ? '#fbbf24'
       : '#4ade80';
  }

  const pts = corners.map(c => [c.x * sx, c.y * sy]);

  // Ghost outline (master position)
  if (master) {
    const ox = (master.cx - meas.cx) * sx;
    const oy = (master.cy - meas.cy) * sy;
    oc.beginPath();
    oc.moveTo(pts[0][0] + ox, pts[0][1] + oy);
    for (let i = 1; i < 4; i++) oc.lineTo(pts[i][0] + ox, pts[i][1] + oy);
    oc.closePath();
    oc.setLineDash([6, 4]);
    oc.strokeStyle = 'rgba(255,255,255,0.4)';
    oc.lineWidth = 2;
    oc.stroke();
    oc.setLineDash([]);

    // Deviation arrow
    drawArrow(
      meas.rawCx * sx, meas.rawCy * sy,
      master.rawCx * sx, master.rawCy * sy,
      sc
    );
  }

  // Outline
  oc.beginPath();
  oc.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < 4; i++) oc.lineTo(pts[i][0], pts[i][1]);
  oc.closePath();
  oc.fillStyle   = sc + '20';
  oc.strokeStyle = sc;
  oc.lineWidth   = 3;
  oc.fill(); oc.stroke();

  // Corner dots (first corner = white = reference edge start)
  pts.forEach(([x, y], i) => {
    oc.beginPath(); oc.arc(x, y, 7, 0, Math.PI * 2);
    oc.fillStyle   = i === 0 ? '#ffffff' : sc;
    oc.strokeStyle = '#000'; oc.lineWidth = 1.5;
    oc.fill(); oc.stroke();
  });

  // 3D axes
  if (meas.pose) drawAxes(meas, sx, sy);

  // ID label
  const cx = pts.reduce((s, p) => s + p[0], 0) / 4;
  const cy = pts.reduce((s, p) => s + p[1], 0) / 4;
  oc.font = 'bold 18px -apple-system,sans-serif';
  oc.textAlign = 'center'; oc.textBaseline = 'middle';
  const tw = oc.measureText(`ID: ${id}`).width + 18;
  oc.fillStyle = 'rgba(0,0,0,0.7)';
  pill(oc, cx - tw / 2, cy - 15, tw, 30, 6);
  oc.fill();
  oc.fillStyle = '#fff';
  oc.fillText(`ID: ${id}`, cx, cy);
}

function drawAxes(meas, sx, sy) {
  const R = meas.pose.bestRotation;
  const T = meas.pose.bestTranslation;
  const W = proc.width, H = proc.height;
  const f = W * 0.8;
  const h = (parseFloat(inSize.value) || 100) * 0.6;

  function proj(x, y, z) {
    const rx = R[0][0]*x + R[0][1]*y + R[0][2]*z + T[0];
    const ry = R[1][0]*x + R[1][1]*y + R[1][2]*z + T[1];
    const rz = R[2][0]*x + R[2][1]*y + R[2][2]*z + T[2];
    return [(rx/rz)*f*sx + overlay.width/2,
            -(ry/rz)*f*sx + overlay.height/2];
  }

  const o  = proj(0, 0, 0);
  const xa = proj(h, 0, 0);
  const ya = proj(0, h, 0);
  const za = proj(0, 0, -h);
  axis(o, xa, '#f44', 'X');
  axis(o, ya, '#4f4', 'Y');
  axis(o, za, '#48f', 'Z');
}

function axis([ox,oy], [tx,ty], color, label) {
  oc.beginPath(); oc.moveTo(ox,oy); oc.lineTo(tx,ty);
  oc.strokeStyle = color; oc.lineWidth = 2.5; oc.stroke();
  oc.beginPath(); oc.arc(tx,ty,4,0,Math.PI*2);
  oc.fillStyle = color; oc.fill();
  oc.font = 'bold 11px -apple-system,sans-serif';
  oc.fillStyle = color; oc.textAlign = 'center'; oc.textBaseline = 'middle';
  oc.fillText(label, tx+(tx-ox)*0.18, ty+(ty-oy)*0.18);
}

function drawArrow(x1,y1,x2,y2,color) {
  const dx=x2-x1, dy=y2-y1;
  if (Math.hypot(dx,dy) < 6) return;
  oc.beginPath(); oc.moveTo(x1,y1); oc.lineTo(x2,y2);
  oc.strokeStyle=color; oc.lineWidth=2.5; oc.stroke();
  const a=Math.atan2(dy,dx);
  oc.beginPath(); oc.moveTo(x2,y2);
  oc.lineTo(x2-13*Math.cos(a-.4), y2-13*Math.sin(a-.4));
  oc.lineTo(x2-13*Math.cos(a+.4), y2-13*Math.sin(a+.4));
  oc.closePath(); oc.fillStyle=color; oc.fill();
}

function pill(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ───────────────────────────────────────────
// Panel renderer
// ───────────────────────────────────────────
function renderPanel() {
  const ids = lastMarkers.map(m => m.id);

  // Keep selection valid
  if (!ids.includes(selectedId) && ids.length > 0) selectedId = ids[0];
  if (ids.length === 0) selectedId = null;

  // Tabs
  tabs.innerHTML = '';
  for (const m of lastMarkers) {
    const t = document.createElement('div');
    t.className = 'm-tab' + (m.id === selectedId ? ' active' : '');
    t.style.setProperty('--tc', colorFor(m.id));
    t.textContent = `ID ${m.id}`;
    t.addEventListener('click', () => { selectedId = m.id; renderPanel(); });
    tabs.appendChild(t);
  }

  const m = lastMarkers.find(m => m.id === selectedId);

  if (!m) {
    measContent.innerHTML = `
      <div id="no-marker-box">
        <p>
          ArUcoマーカーをカメラに向けると<br>
          ここに計測値が表示されます。<br><br>
          <a href="https://chev.me/arucogen/" target="_blank">
            ▶ ARUCOマーカーを生成する
          </a>
        </p>
      </div>`;
    btnRowWrap.style.display = 'none';
    return;
  }

  btnRowWrap.style.display = 'block';

  const master = masters[m.id];
  const tolPos = parseFloat(inTolPos.value) || 10;
  const tolAng = parseFloat(inTolAng.value) || 3;

  if (master) {
    btnMaster.textContent = 'マスター更新';
    btnMaster.classList.add('registered');
    master.rawCx = master.rawCx ?? (master.cx + proc.width  / 2);
    master.rawCy = master.rawCy ?? (master.cy + proc.height / 2);
  } else {
    btnMaster.textContent = 'マスター登録';
    btnMaster.classList.remove('registered');
  }

  const { meas } = m;
  const f1 = v => v == null ? '--' : v.toFixed(1);
  const f0 = v => v == null ? '--' : Math.round(v);
  const sign = v => v >= 0 ? '+' : '';

  function cls(v, tol) {
    if (v == null) return '';
    return Math.abs(v) <= tol ? 'good' : Math.abs(v) <= tol * 2 ? 'warn' : 'bad';
  }

  // Deviations
  let dX=null, dY=null, dA=null, dP=null, dR=null;
  if (master) {
    dX = meas.cx    - master.cx;
    dY = meas.cy    - master.cy;
    dA = angleDiff(meas.angle, master.angle);
    if (meas.pitch != null && master.pitch != null) dP = meas.pitch - master.pitch;
    if (meas.roll  != null && master.roll  != null) dR = meas.roll  - master.roll;
  }

  measContent.innerHTML = `
    <div class="meas-grid">
      <div class="meas-card">
        <h4>位置（画面中心から）</h4>
        <div class="meas-row">
          <span class="meas-key">X（右＋）</span>
          <span class="meas-val">${f0(meas.cx)} px</span>
        </div>
        <div class="meas-row">
          <span class="meas-key">Y（下＋）</span>
          <span class="meas-val">${f0(meas.cy)} px</span>
        </div>
        ${meas.scale ? `<div class="meas-row">
          <span class="meas-key">スケール</span>
          <span class="meas-val">${meas.scale.toFixed(2)} px/mm</span>
        </div>` : ''}
      </div>
      <div class="meas-card">
        <h4>角度・傾き</h4>
        <div class="meas-row">
          <span class="meas-key">面内角度</span>
          <span class="meas-val">${f1(meas.angle)}°</span>
        </div>
        <div class="meas-row">
          <span class="meas-key">ピッチ</span>
          <span class="meas-val">${f1(meas.pitch)}°</span>
        </div>
        <div class="meas-row">
          <span class="meas-key">ロール</span>
          <span class="meas-val">${f1(meas.roll)}°</span>
        </div>
        ${meas.distCm != null ? `<div class="meas-row">
          <span class="meas-key">距離</span>
          <span class="meas-val">${f1(meas.distCm)} cm</span>
        </div>` : ''}
      </div>

      ${master ? `
      <div class="meas-card full">
        <h4>マスターからのズレ</h4>
        <div class="meas-row">
          <span class="meas-key">ΔX</span>
          <span class="meas-val ${cls(dX,tolPos)}">${sign(dX)}${f0(dX)} px</span>
        </div>
        <div class="meas-row">
          <span class="meas-key">ΔY</span>
          <span class="meas-val ${cls(dY,tolPos)}">${sign(dY)}${f0(dY)} px</span>
        </div>
        <div class="meas-row">
          <span class="meas-key">Δ面内角度</span>
          <span class="meas-val ${cls(dA,tolAng)}">${sign(dA)}${f1(dA)}°</span>
        </div>
        ${dP != null ? `<div class="meas-row">
          <span class="meas-key">Δピッチ</span>
          <span class="meas-val ${cls(dP,tolAng)}">${sign(dP)}${f1(dP)}°</span>
        </div>` : ''}
        ${dR != null ? `<div class="meas-row">
          <span class="meas-key">Δロール</span>
          <span class="meas-val ${cls(dR,tolAng)}">${sign(dR)}${f1(dR)}°</span>
        </div>` : ''}
      </div>` : `
      <div class="meas-card full" style="text-align:center;padding:14px;">
        <p style="color:#475569;font-size:12px;">
          「マスター登録」をタップすると<br>現在位置を基準として保存します
        </p>
      </div>`}
    </div>`;
}

// ───────────────────────────────────────────
// Helpers
// ───────────────────────────────────────────
function angleDiff(a, b) {
  let d = a - b;
  while (d >  180) d -= 360;
  while (d < -180) d += 360;
  return d;
}
</script>
